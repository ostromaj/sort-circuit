  $('#rK').textContent = '×1'; $('#rH').textContent = '●'.repeat(R.hits) + '○'.repeat(Math.max(0, 3 - R.hits));
  toast({ stone: 'Ouch! Ran into a carved block.', column: 'Tripped on a fallen column! Jump it.', pit: 'Fell into a pit! Jump it.', beam: 'Bonk! Slide under low beams (↓).' }[o.kind], true);
  if (R.hits >= 3) { R.boulderGoal = 1.4; endRun(false); }
}
function endRun(escaped) {
  if (R.ended) return; R.ended = true; if (escaped) { R.pts += 100; SFX.win(); } else { SFX.thud(); SFX.rumble(); }
  bumpScore(R.pts);
  setTimeout(() => {
    R.on = false; activeScene = 'temple';
    setScreen('runDone', '<div class="center"><div class="panel pe" style="text-align:center"><div class="kicker">Boulder run</div><h2 style="font-size:32px;margin:6px 0 12px;color:var(--gold)">' + (escaped ? '🏃 You escaped!' : '🪨 Flattened… but you crawl out.') + '</h2>' +
      '<div class="grid3"><div><div class="stat">' + R.coins + '<small>coins' + (R.gems ? '' : '') + '</small></div></div><div><div class="stat">' + Math.round(R.dist) + ' m<small>distance</small></div></div><div><div class="stat">+' + R.pts + '<small>points' + (escaped ? ' (incl. +100 escape)' : '') + '</small></div></div></div>' +
      '<p class="sub" style="margin-top:12px">Best combo ×' + Math.min(R.bestCombo, 10) + '. ' + (G.wedges > R.wedgesStart ? '🪵 You earned ' + (G.wedges - R.wedgesStart) + ' wedge' + (G.wedges - R.wedgesStart > 1 ? 's' : '') + '. ' : '') + 'Wedges: ' + G.wedges + '/3.</p>' +
      '<div class="row" style="justify-content:center;margin-top:14px"><button class="btn" id="go" type="button">Into the next chamber ➜</button></div></div></div>');
    $('#go').onclick = () => { G.chamber++; chamberIntro(); };
  }, escaped ? 900 : 1500);
}

// ================= end =================
function endScreen() {
  demoToken++; activeScene = 'temple';
  const acc = G.moves + G.mistakes ? Math.round(100 * G.moves / (G.moves + G.mistakes)) : 100;
  const k = 'sc-best-' + G.mode, prev = +store.get(k, '0'), newBest = G.score > prev; if (newBest) store.set(k, String(G.score));
  netPush('done', G.score);
  P = null; buildRow([7, 21, 36, 50, 64, 79, 93]); WALLS.shown = ROW.half + 5; setWalls(WALLS.shown);
  ROW.blocks.forEach((m, i) => { m.userData.spin = .4 + i * .05; m.userData.liftTarget = .25 + .12 * Math.sin(i); });
  setScreen('end', '<div class="center"><div class="panel pe"><div class="kicker">All 5 chambers · ' + G.mode.toUpperCase() + '</div><h2 style="font-size:36px;margin:6px 0 8px;color:var(--gold)">🗿 You claimed the idol!</h2>' +
    '<div style="font-size:56px;font-weight:800;color:var(--gold)">' + G.score.toLocaleString() + '</div><p class="note" style="margin-top:0">points' + (newBest ? ' · <b style="color:var(--torch)">new personal best!</b>' : ' · your best: ' + prev.toLocaleString()) + '</p>' +
    '<div class="grid3"><div><div class="stat">' + acc + '%<small>move accuracy</small></div></div><div><div class="stat">' + G.perfect + '/' + G.puzzlesDone + '<small>perfect rows</small></div></div><div><div class="stat">' + G.bestStreak + '<small>best streak</small></div></div></div>' +
    '<p class="note" style="margin-top:10px">Crushed ' + G.crushes + ' time' + (G.crushes === 1 ? '' : 's') + ' · ' + G.coinsTotal + ' coins grabbed</p>' +
    '<div id="endlb"></div><div class="row" style="margin-top:14px"><button class="btn" id="again" type="button">Play again</button><button class="btn ghost" id="sw" type="button">Try ' + (G.mode === 'sl' ? 'HL' : 'SL') + ' mode</button></div></div></div>');
  fitCamera({ t: measureBar() + 4 });
  SFX.win(); $('#again').onclick = titleScreen; $('#sw').onclick = () => { G.mode = G.mode === 'sl' ? 'hl' : 'sl'; store.set('sc-mode', G.mode); titleScreen(); };
  renderLbInto($('#endlb'), true);
}

// ================= main loop =================
let last = performance.now(), tAll = 0, perfFrames = 0, perfT = 0, perfStage = 0;
function adaptQuality(rawDt) {
  if (perfStage >= 2 || document.hidden) return; perfFrames++; perfT += rawDt;
  if (perfT < 2.5) return; const fps = perfFrames / perfT; perfFrames = 0; perfT = 0;
  if (fps < 32) { perfStage++; if (perfStage === 1) { pixelCap = 1; renderer.setPixelRatio(1); } else { renderer.shadowMap.enabled = false; temple.traverse(o => { if (o.material) (Array.isArray(o.material) ? o.material : [o.material]).forEach(m => { m.needsUpdate = true; }); }); } renderer.setSize(innerWidth, innerHeight); }
  else perfStage = 2;
}
function loop(now) {
  const raw = Math.max(0, (now - last) / 1000), dt = Math.min(.05, raw); last = now; tAll += dt; adaptQuality(Math.min(raw, 1));
  stepTweens(dt);
  if (shakeT > 0) shakeT -= dt; else shakeAmp = 0;
  if (activeScene === 'run') { runUpdate(dt); renderer.render(run, runCam); requestAnimationFrame(loop); return; }
  // torches flicker gently (no flashing)
  for (const t of torches) { const f = 1 + .07 * Math.sin(tAll * 6.1 + t.seed) + .04 * Math.sin(tAll * 11.3 + t.seed * 2); if (t.light) t.light.intensity = 26 * f; t.flame.scale.set(1, f, 1); t.glow.material.opacity = .75 + .1 * Math.sin(tAll * 5 + t.seed); }
  // dust
  const pa = dustGeo.attributes.position; dustBoost = Math.max(0, dustBoost - dt * .8);
  for (let k = 0; k < DUST; k++) { let y = pa.getY(k) - dt * (.08 + dustBoost * 1.6); if (y < 0) y = 8; pa.setY(k, y); pa.setX(k, pa.getX(k) + Math.sin(tAll * .3 + k) * dt * .05); }
  pa.needsUpdate = true;
  // walls
  if (G.screen === 'play' && P) {
    if (!P.done) P.rem -= P.busy ? dt * .5 : dt;
    const frac = P.rem / P.T, goal = P.crushed ? ROW.half - .02 : P.done ? wallInnerFor(1) : wallInnerFor(frac);
    WALLS.shown = lerp(WALLS.shown, goal, Math.min(1, dt * (P.crushed ? 9 : 5))); setWalls(WALLS.shown);
    const mi = $('#meterI');
    if (mi) { mi.style.width = clamp(frac * 100, 0, 100) + '%'; $('#meter').classList.toggle('danger', frac < .3); const wt = $('#wallTxt'); if (wt) wt.textContent = P.done ? '' : Math.max(0, Math.ceil(P.rem)) + 's until they reach the stones'; }
    if (!P.done && frac < .3 && tAll - P.lastRumble > 2.6) { P.lastRumble = tAll; SFX.grind(); dustBoost = Math.max(dustBoost, .5); }
    if (!P.done && P.rem <= 0) crushed();
  }
  // stones: lift, glow
  for (const m of ROW.blocks) {
    const u = m.userData; if (!m.visible) continue;
    u.lift = lerp(u.lift, u.liftTarget, Math.min(1, dt * 10));
    if (!u.tw) {
      const bob = u.liftTarget > 0 ? Math.sin(tAll * 3 + u.id) * .05 : 0;
      m.position.y = ROW.baseY + u.lift + bob;
      if (P) m.position.x = lerp(m.position.x, xAt(posOf(u.id)), Math.min(1, dt * 12));
    }
    if (u.spin) m.rotation.y += dt * u.spin * 1.5;
    let em = 0x000000, ei = 0, dim = 1;
    if (P) {
      const p = posOf(u.id), o = P.pz.ops[P.k];
      if (P.locked.has(p)) { em = 0xb8860b; ei = .28; }
      if (P.kind === 'quick' && o && !P.done) { if (p < o.lo || p > o.hi) dim = .45; if (p === o.hi && o.t === 'qcmp') { em = 0x8b5cf6; ei = .45; } }
      if (P.sel === u.id) { em = 0x52d3e0; ei = .5; }
      if (P.hint && P.hint.includes(u.id)) { em = 0xff5a8a; ei = .35 + .15 * Math.sin(tAll * 3); }
      if (P.foundPos === p) { em = 0x4fe0a8; ei = .6; }
      if (hoverId === u.id && P.sel !== u.id && !P.done && !ei) { em = 0xffe2a8; ei = .1; }
      if (P.kbd && p === P.cursor && !P.done) { em = 0xf0bf4c; ei = Math.max(ei, .4); }
    }
    for (const mt of [u.side, u.face]) { mt.emissive.setHex(em); mt.emissiveIntensity = ei; mt.color.setScalar(dim); }
  }
  // camera ease + shake
  camera.position.lerp(camGoal.pos, Math.min(1, dt * 3)); camLook.lerp(camGoal.look, Math.min(1, dt * 3));
  if (G.screen === 'title' && !reduceMotion) camera.position.x = camGoal.pos.x + Math.sin(tAll * .25) * 1.2;
  const sh = shakeT > 0 ? shakeAmp * (shakeT / .35) : 0; camera.lookAt(camLook.x + (Math.random() - .5) * sh, camLook.y + (Math.random() - .5) * sh, camLook.z);
  renderer.render(temple, camera);
  requestAnimationFrame(loop);
}

// ================= class leaderboard (Firebase) =================
const NET = { db: null, ref: null, rows: [], status: 'off', pid: null };
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('load')); document.head.appendChild(el); }); }
function roomPath() { return 'rooms/sc-' + G.mode + '-' + G.cls + '/info'; }
async function netJoin() {
  NET.rows = []; NET.status = 'off'; if (NET.ref) { try { NET.ref.off(); } catch (e) {} NET.ref = null; }
  if (!G.cls || !window.FIREBASE_CONFIG) return;
  NET.status = 'connecting';
  try {
    for (const u of ['https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js', 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'])
      if (!(window.firebase && window.firebase.database)) await loadScript(u);
    const fb = window.firebase, app = fb.apps.find(a => a.name === 'sc') || fb.initializeApp(window.FIREBASE_CONFIG, 'sc');
    NET.db = app.database();
    let pid = store.get('sc-pid', ''); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12); store.set('sc-pid', pid); } NET.pid = pid;
    NET.ref = NET.db.ref(roomPath());
    NET.ref.on('value', snap => {
      const v = snap.val() || {};
      NET.rows = Object.keys(v).map(id => ({ me: id === NET.pid, n: String((v[id] && v[id].nick) || '?').slice(0, 16), s: Math.max(0, Math.min(1e7, Math.floor(+(v[id] && v[id].score) || 0))), st: String((v[id] && v[id].stage) || '').slice(0, 8) })).sort((a, b) => b.s - a.s);
      NET.status = 'on'; document.querySelectorAll('[data-lb]').forEach(el => renderLbInto(el, el.dataset.lb === 'end'));
    }, () => { NET.status = 'fail'; });
  } catch (e) { NET.status = 'fail'; }
}
function netPush(stage, finalScore) {
  if (!NET.db || !NET.pid) return;
  const live = finalScore !== undefined ? finalScore : G.score, mine = NET.rows.find(r => r.me);
  if (mine && mine.st === 'done' && mine.s > live) return;
  try { NET.db.ref(roomPath() + '/' + NET.pid).set({ nick: G.nick, nm: G.nick, score: live, stage }).catch(() => {}); } catch (e) {}
}
function renderLbInto(el, isEnd) {
  if (!el) return; el.dataset.lb = isEnd ? 'end' : 'modal';
  if (!G.cls) { el.innerHTML = isEnd ? '<p class="note" style="margin-top:12px">Add a class code on the title screen to compare scores with your classmates.</p>' : '<p class="sub">You’re playing without a class code. Add one on the title screen to compare scores with your class!</p>'; return; }
  if (NET.status === 'fail') { el.innerHTML = '<p class="note" style="margin-top:12px">Couldn’t reach the class leaderboard (maybe the school network blocks it). Your score still counts on this device.</p>'; return; }
  if (NET.status !== 'on') { el.innerHTML = '<p class="note" style="margin-top:12px">Connecting to the class leaderboard…</p>'; return; }
  const ST = { c1: 'Chamber 1', c2: 'Chamber 2', c3: 'Chamber 3', c4: 'Chamber 4', c5: 'Chamber 5', done: 'Finished' };
  el.innerHTML = '<div class="kicker" style="margin-top:14px">Class ' + esc(G.cls.toUpperCase()) + ' · ' + G.mode.toUpperCase() + '</div><ol class="lb">' +
    (NET.rows.slice(0, 15).map((r, i) => '<li class="' + (r.me ? 'me' : '') + '"><span>' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)) + '</span><span>' + esc(r.n) + (r.me ? ' (you)' : '') + '</span><span class="note">' + (ST[r.st] || '') + '</span><span class="s">' + r.s.toLocaleString() + '</span></li>').join('') || '<li><span></span><span class="note">No scores yet. Be the first!</span><span></span><span></span></li>') + '</ol>';
}
function showLeaderboard() {
  const m = $('#modal'); m.innerHTML = '<div class="panel"><h2 style="font-size:24px">🏆 Class leaderboard</h2><div id="mlb"></div><div class="row" style="margin-top:12px"><button class="btn" id="mclose" type="button">Close</button></div></div>';
  m.hidden = false; renderLbInto($('#mlb'), false);
  $('#mclose').onclick = () => { m.hidden = true; m.innerHTML = ''; }; m.onclick = e => { if (e.target === m) { m.hidden = true; m.innerHTML = ''; } };
}

// test hooks (used by the automated checks; harmless in class)
window.SC = { setFast(v) { FAST = !!v; }, G, get P() { return P; }, get R() { return R; }, act, expected, startPuzzle, chamberIntro, runIntro, startRun, runInput, endScreen, posOf, tapStone, meshOf, camera, pickAt };
(document.fonts && document.fonts.ready ? Promise.race([document.fonts.ready, sleep(1500)]) : Promise.resolve()).then(() => { blockTexCache.clear(); labelCache.clear(); titleScreen(); requestAnimationFrame(loop); });
</script>
