<script>
(function () {
'use strict';
const E = window.SCEngine;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const store = { get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} } };
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));

// ================= sound (synthesized) =================
let AC = null, soundOn = store.get('sc-sound', '1') === '1';
function tone(f, d = 0.1, type = 'sine', vol = 0.06, slide = 0, delay = 0) {
  if (!soundOn) return;
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    const t = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, f + slide), t + d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t + d + 0.02);
  } catch (e) {}
}
const SFX = {
  pick() { tone(520, .06, 'triangle', .05); },
  good(streak) { const f = 440 * Math.pow(2, Math.min(streak, 24) / 12); tone(f, .09, 'triangle', .06); tone(f * 1.5, .08, 'sine', .03, 0, .05); },
  bad() { tone(180, .22, 'sawtooth', .05, -80); },
  lock() { tone(880, .08, 'sine', .05); tone(1320, .12, 'sine', .04, 0, .07); },
  win() { [523, 659, 784, 1046].forEach((f, i) => tone(f, .16, 'triangle', .06, 0, i * .1)); },
  zap(c) { const f = 300 + Math.min(c, 30) * 40; tone(f, .07, 'square', .035, 400); tone(f * 2, .05, 'sine', .03, 0, .04); },
  fuzz() { tone(120, .4, 'sawtooth', .04, -40); },
  thud() { tone(140, .12, 'sine', .07, -60); }
};

// ================= the villain =================
function staticSVG(mood = 'idle', size = 120) {
  const pts = []; const R = 44, r = 34, N = 14;
  for (let k = 0; k < N * 2; k++) { const a = Math.PI * k / N, rr = k % 2 ? r : R + (k % 4 === 0 ? 4 : 0); pts.push((60 + Math.cos(a) * rr).toFixed(1) + ',' + (62 + Math.sin(a) * rr).toFixed(1)); }
  const eyes = mood === 'hurt'
    ? '<path d="M38 52 l12 10 M50 52 l-12 10 M70 52 l12 10 M82 52 l-12 10" stroke="#1a0b33" stroke-width="5" stroke-linecap="round"/>'
    : '<circle cx="45" cy="56" r="11" fill="#f4f0ff"/><circle cx="76" cy="56" r="11" fill="#f4f0ff"/><circle cx="' + (mood === 'laugh' ? 45 : 48) + '" cy="58" r="5" fill="#1a0b33"/><circle cx="' + (mood === 'laugh' ? 76 : 79) + '" cy="58" r="5" fill="#1a0b33"/>' +
      '<path d="M33 41 l20 6 M88 41 l-20 6" stroke="#1a0b33" stroke-width="4" stroke-linecap="round"/>';
  const mouth = mood === 'hurt' ? '<path d="M46 84 q15 -10 30 0" stroke="#1a0b33" stroke-width="4" fill="none" stroke-linecap="round"/>'
    : mood === 'laugh' ? '<path d="M40 76 q21 24 42 0 z" fill="#1a0b33"/><path d="M48 77 l4 6 l4 -6 l4 6 l4 -6 l4 6 l4 -6" stroke="#f4f0ff" stroke-width="2" fill="none"/>'
    : '<path d="M42 78 q19 14 38 0" stroke="#1a0b33" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M50 81 l3 5 l3 -4 l3 4 l3 -4 l3 4" stroke="#f4f0ff" stroke-width="2" fill="none"/>';
  return '<svg viewBox="0 0 120 124" width="' + size + '" height="' + (size * 124 / 120) + '" aria-hidden="true">' +
    '<path d="M60 8 l-7 -8 l3 9 l-6 1 l10 10" fill="none" stroke="#ffd23f" stroke-width="3" stroke-linejoin="round"/>' +
    '<polygon points="' + pts.join(' ') + '" fill="#7d4dff" stroke="#1a0b33" stroke-width="4" stroke-linejoin="round"/>' +
    '<circle cx="60" cy="62" r="30" fill="#9b72ff"/>' + eyes + mouth + '</svg>';
}

// ================= game data =================
const ALGO_RULES = {
  bubble: '<b>Bubble sort:</b> compare the two highlighted neighbours. If the left one is bigger, swap them; otherwise leave them. After each pass the biggest unsorted value has bubbled to the end. A pass with no swaps means it’s sorted, so stop.',
  selection: '<b>Selection sort:</b> on pass I, find the smallest value from index I to the end and swap it into index I. If it’s already there, leave it.',
  binary: '<b>Binary search</b> (sorted data only): pick up the MID block, where MID = (LOW + HIGH) div 2 (round down). If it’s the target, done. Otherwise toss the half that can’t hold the target, MID included. If LOW passes HIGH, it’s not there.',
  quick: '<b>Quicksort</b> (HL): the pivot is the <b>last</b> value of the section. Scan J from left to right: if A[J] is smaller than the pivot, swap it into the spot just after the small zone (I + 1); if not, leave it. Then swap the pivot in right after the small zone. Sort the left section, then the right.'
};
const CODE = {
  bubble: ['loop PASS from 0 to N-2', '  SWAPPED = false', '  loop J from 0 to N-2-PASS', '    if A[J] > A[J+1] then', '      swap A[J], A[J+1]', '      SWAPPED = true', '  if not SWAPPED then stop'],
  selection: ['loop I from 0 to N-2', '  MIN = I', '  loop J from I+1 to N-1', '    if A[J] < A[MIN] then', '      MIN = J', '  swap A[I], A[MIN]'],
  binary: ['LOW = 0, HIGH = N-1', 'loop while LOW <= HIGH', '  MID = (LOW + HIGH) div 2', '  if A[MID] = TARGET then', '    return MID', '  else if A[MID] < TARGET then', '    LOW = MID + 1', '  else HIGH = MID - 1', 'return -1  // not found'],
  quick: ['quicksort(LO, HI):', '  if LO < HI then', '    P = partition(LO, HI)', '    quicksort(LO, P-1)', '    quicksort(P+1, HI)', '', 'partition(LO, HI):', '  PIVOT = A[HI], I = LO - 1', '  loop J from LO to HI-1', '    if A[J] < PIVOT then', '      I = I + 1', '      swap A[I], A[J]', '  swap A[I+1], A[HI]', '  return I + 1']
};
const CIRCUITS = {
  sl: [
    { name: 'Boot Up', icon: '🔌', blurb: 'Static scrambled the power grid. Bubble sort it back, one neighbour swap at a time.', puzzles: [{ kind: 'bubble', n: 5 }, { kind: 'bubble', n: 6, maxOps: 15 }] },
    { name: 'Selection Station', icon: '🎯', blurb: 'Grab the smallest block and slam it into place. Pass after pass.', puzzles: [{ kind: 'selection', n: 5 }, { kind: 'selection', n: 6 }] },
    { name: 'Search Party', icon: '🔎', blurb: 'Static hid a value in a sorted row. Halve the search until you find it, or prove it isn’t there.', puzzles: [{ kind: 'binary', n: 11 }, { kind: 'binary', n: 13, found: false }] },
    { name: 'Mixed Signals', icon: '📡', blurb: 'All three algorithms. And Static has started fuzzing your blocks, so zap him when he shows up.', ambush: 1, puzzles: [{ kind: 'bubble', n: 6, maxOps: 15 }, { kind: 'selection', n: 7 }, { kind: 'binary', n: 15 }] },
    { name: 'Static’s Overload', icon: '⚡', blurb: 'Boss circuit. Bigger arrays, more fuzz. Keep that streak alive.', ambush: 2, boss: true, puzzles: [{ kind: 'bubble', n: 7, maxOps: 21 }, { kind: 'selection', n: 7 }, { kind: 'binary', n: 15, found: false }] }
  ],
  hl: [
    { name: 'Boot Up', icon: '🔌', blurb: 'Warm-up: one bubble sort, one selection sort. Every step by hand.', puzzles: [{ kind: 'bubble', n: 6, maxOps: 15 }, { kind: 'selection', n: 6 }] },

function runDemo() {
  const st = $('#demo'); if (!st) return;
  let arr = E.shuffle([12, 27, 41, 58, 73, 90]), ops = E.bubbleOps(arr).ops, k = 0, hold = 0;
  const draw = (hi) => { const W = st.clientWidth, n = arr.length, gap = 8, bw = Math.min(62, (W - 24 - gap * (n - 1)) / n), x0 = (W - (bw * n + gap * (n - 1))) / 2;

    if (!document.body.contains(st)) { stopDemo(); return; }
    if (hold > 0) { hold--; if (!hold) { arr = E.shuffle(arr); ops = E.bubbleOps(arr).ops; k = 0; draw(); } return; }

}

function geom() {
  const st = $('#stage'), W = st.clientWidth, H = st.clientHeight, n = P.vals.length;
  let gap = n > 10 ? 6 : 10, pad = 28;
  if ((W - pad - gap * (n - 1)) / n < 36) { gap = 3; pad = 10; }
  const bw = Math.floor(Math.min(84, (W - pad - gap * (n - 1)) / n)), x0 = Math.round((W - (bw * n + gap * (n - 1))) / 2), y0 = 80;
  return { W, H, n, gap, bw, x0, y0, xAt: pos => x0 + pos * (bw + gap) };
}
function layout() {

  for (let pos = 0; pos < g.n; pos++) { const d = document.createElement('div'); d.className = 'idx'; d.style.cssText = 'left:' + g.xAt(pos) + 'px;width:' + g.bw + 'px;top:' + (g.y0 + g.bw + 30) + 'px'; d.textContent = pos; st.appendChild(d); }
  P.order.forEach((id, pos) => {
    const b = st.querySelector('.blk[data-id="' + id + '"]'); if (!b || b.classList.contains('drag')) return;
    const lifted = b.classList.contains('lift') ? -18 : 0, dropped = P.gone.has(pos) ? 26 : 0;
    b.style.cssText = blockStyle(P.vals[id], g.bw, g.bw) + 'transform:translate(' + g.xAt(pos) + 'px,' + (g.y0 + lifted + dropped) + 'px)';
  });
  drawMarkers();
}

function blockAt(pos) { return $('#stage .blk[data-id="' + P.order[pos] + '"]'); }
function posOf(id) { return P.order.indexOf(+id); }
function curVal(pos) { return P.vals[P.order[pos]]; }

function drawMarkers() {
  const st = $('#stage'); st.querySelectorAll('.mk,.zone').forEach(e => e.remove());
  if (!P || P.done && P.kind !== 'binary') return;
  const g = geom(), o = P.pz.ops[P.k];
  const zone = (a, b, color, label) => { if (a > b) return; const z = document.createElement('div'); z.className = 'zone'; z.style.cssText = 'left:' + (g.xAt(a) - 6) + 'px;width:' + (g.xAt(b) - g.xAt(a) + g.bw + 12) + 'px;top:' + (g.y0 - 10) + 'px;height:' + (g.bw + 20) + 'px;background:' + color;
    st.appendChild(z); if (label) mark(a, label, 'var(--muted)', 'transparent', g.y0 - 32, b); };
  const mark = (pos, text, fg, bg, top, posEnd) => { const m = document.createElement('div'); m.className = 'mk'; const end = posEnd === undefined ? pos : posEnd;
    m.style.cssText = 'left:' + g.xAt(pos) + 'px;width:' + (g.xAt(end) - g.xAt(pos) + g.bw) + 'px;top:' + top + 'px'; m.innerHTML = '<span class="tag" style="color:' + fg + ';background:' + bg + '">' + text + '</span>'; st.appendChild(m); };
  const below = g.y0 + g.bw + 50, tight = g.bw < 40, T = (long, short) => tight ? short : long;
  st.classList.toggle('tight', tight);
  if (P.kind === 'bubble' && o) { zone(o.a, o.b, 'rgba(255,210,63,.12)'); mark(o.a, 'J', '#241b00', 'var(--volt)', below); mark(o.b, 'J+1', '#241b00', 'var(--volt)', below); }
  if (P.kind === 'selection' && o) { zone(o.i, g.n - 1, 'rgba(77,225,255,.08)', 'unsorted part'); mark(o.i, 'I', '#062019', 'var(--cyan)', below); }
  if (P.kind === 'binary') {
    if (P.low <= P.high) { zone(P.low, P.high, 'rgba(77,225,255,.1)'); mark(P.low, T('LOW', 'L'), '#062019', 'var(--cyan)', below); mark(P.high, T('HIGH', 'H'), '#062019', 'var(--cyan)', P.high === P.low ? below + 24 : below); }
    if (P.picked && o) mark(o.mid, T('MID', 'M'), '#241b00', 'var(--volt)', below + (o.mid === P.low || o.mid === P.high ? 24 : 0) + (P.low === P.high ? 24 : 0));
  }
  if (P.kind === 'quick' && o) {
    zone(o.lo, o.hi, 'rgba(169,139,255,.1)', 'quicksort(' + o.lo + ', ' + o.hi + ')');
    const i = o.t === 'qcmp' ? o.i : o.to - 1;
    if (i >= o.lo) zone(o.lo, i, 'rgba(61,255,181,.14)');
    mark(o.hi, T('★ pivot', '★'), '#1a0b33', 'var(--purple)', below);
    if (o.t === 'qcmp') { mark(o.j, 'J', '#241b00', 'var(--volt)', below + 24); mark(Math.max(o.lo, 0), T('I = ', 'I=') + o.i, 'var(--mint)', 'transparent', below + 48); }
    else mark(o.to, 'I+1', '#062019', 'var(--mint)', below + 24);
  }
}

function renderStep() {

// ----- block interaction: drag onto another, or tap-tap -----
function attachBlock(b) {
  let start = null, dragging = false, overEl = null;
  b.addEventListener('pointerdown', e => {
    if (!P || P.done || P.busy || P.gone.has(posOf(b.dataset.id))) return;
    if (P.kind === 'binary') return; // binary uses taps (click)
    start = { x: e.clientX, y: e.clientY }; dragging = false; try { b.setPointerCapture(e.pointerId); } catch (er) {}
  });
  b.addEventListener('pointermove', e => {
    if (!start) return;
    const dx = e.clientX - start.x, dy = e.clientY - start.y;
    if (!dragging && Math.hypot(dx, dy) > 8) { dragging = true; clearSel(); b.classList.add('drag', 'lift'); SFX.pick(); b.dataset.base = b.style.transform; }
    if (dragging) {
      b.style.transform = b.dataset.base.replace(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/, (m, x, y) => 'translate(' + (+x + dx) + 'px,' + (+y + dy - 14) + 'px) scale(1.08)');
      const el = document.elementFromPoint(e.clientX, e.clientY), t = el && el.closest && el.closest('.blk');
      if (overEl && overEl !== t) overEl.classList.remove('over');
      overEl = t && t !== b && !t.classList.contains('drag') ? t : null; if (overEl) overEl.classList.add('over');
    }
  });
  const end = () => {
    if (!start) return; start = null;
    if (dragging) {
      dragging = false; b.classList.remove('drag', 'lift'); const t = overEl; if (overEl) overEl.classList.remove('over'); overEl = null;
      b.dataset.justDragged = '1'; setTimeout(() => { delete b.dataset.justDragged; }, 60);
      if (t) act({ kind: 'swap', a: +b.dataset.id, b: +t.dataset.id }); else layout();
    }
  };
  b.addEventListener('pointerup', end); b.addEventListener('pointercancel', () => { if (start) { start = null; dragging = false; b.classList.remove('drag', 'lift'); if (overEl) overEl.classList.remove('over'); overEl = null; layout(); } });
  b.addEventListener('click', () => {
    if (!P || P.done || P.busy || b.dataset.justDragged) return;
    const id = +b.dataset.id, pos = posOf(id);
    if (P.kind === 'binary') {
      if (P.gone.has(pos)) return;
      const o = P.pz.ops[P.k]; if (!o) return;
      if (o.t === 'mid') act({ kind: 'pick', pos });
      else if (o.t === 'cut') { if (pos < o.mid) act({ kind: 'cut', side: 'left' }); else if (pos > o.mid) act({ kind: 'cut', side: 'right' }); }
      return;
    }
    if (P.sel === null) { P.sel = id; b.classList.add('lift'); SFX.pick(); layout(); }
    else if (P.sel === id) clearSel();
    else { const a = P.sel; clearSel(); act({ kind: 'swap', a, b: id }); }
  });
}
function clearSel() { if (P && P.sel !== null) { const e = $('#stage .blk[data-id="' + P.sel + '"]'); if (e) e.classList.remove('lift'); P.sel = null; layout(); } }

    for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= .92; p.vy *= .92; ctx.globalAlpha = Math.max(0, p.life / .5); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 3.5, 0, 7); ctx.fill(); }
    ctx.globalAlpha = 1; foes.forEach(drawStatic);
    ctx.font = '800 20px Rubik, sans-serif'; ctx.textAlign = 'center';
    for (const p of floats) { ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = '#ffd23f'; ctx.fillText(p.text, p.x, p.y - (1 - p.life) * 30); }
    ctx.globalAlpha = 1; $('#sT').textContent = Math.ceil(timeLeft);
    requestAnimationFrame(frame);
  }
  cv.addEventListener('pointerdown', e => {
    if (!running) return; const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
    let hit = -1, best = 1e9; foes.forEach((f, i) => { const d = Math.hypot(f.x - x, f.y - y); if (d < f.r + 14 && d < best) { best = d; hit = i; } });
    if (hit < 0) return;
    const f = foes[hit], now = performance.now(); combo = now - lastZap < 1300 ? combo + 1 : 1; lastZap = now; bestCombo = Math.max(bestCombo, combo); zaps++; G.zapsTotal++;
    const gain = Math.min(combo, 10); pts += gain; SFX.zap(combo);
    const cols = ['#ffd23f', '#4de1ff', '#3dffb5', '#ff5c8a'];
    if (!reduceMotion) for (let k = 0; k < 12; k++) { const a = Math.random() * 7, s = 80 + Math.random() * 160; parts.push({ x: f.x, y: f.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: .5, c: cols[k % 4] }); }
    floats.push({ x: f.x, y: f.y - f.r, text: '+' + gain, life: .9 });
    foes.splice(hit, 1);
    if (f.r > 16) { const nr = f.r * .66; foes.push(mk(f.x - nr / 2, f.y, nr), mk(f.x + nr / 2, f.y, nr)); }
    if (!foes.length) { waves++; pts += 50; floats.push({ x: W / 2, y: H / 2, text: 'WAVE CLEARED +50', life: 1.2 }); foes.push(mk(Math.random() * (W - 100) + 50, Math.random() * (H - 100) + 50, 46)); tone(523, .15, 'triangle', .06); tone(784, .2, 'triangle', .06, 0, .1); }
    if (zaps % 15 === 0 && G.shields < 3) { G.shields++; floats.push({ x: W / 2, y: 60, text: '🛡️ +1 SHIELD', life: 1.2 }); $('#sS').textContent = G.shields; }
    $('#sZ').textContent = zaps; $('#sC').textContent = '×' + combo;
  });
  const onR = () => { if (G.screen === 'smash' && running) resize(); }; window.addEventListener('resize', onR);
  requestAnimationFrame(t => { last = t; frame(t); });
  function smashDone() {
    window.removeEventListener('resize', onR); bumpScore(pts); SFX.win();
    setScreen('smash', '<div class="grid2"><div class="card"><div class="kicker">Static Smash results</div><h2 style="font-size:34px;margin:6px 0 12px">⚡ ' + (zaps >= 30 ? 'Absolute zap machine!' : zaps >= 15 ? 'Nice zapping!' : 'He got away… for now.') + '</h2>' +
      '<div class="grid3"><div class="card"><div class="stat">' + zaps + '<small>zaps</small></div></div><div class="card"><div class="stat">×' + bestCombo + '<small>best combo</small></div></div><div class="card"><div class="stat">+' + pts + '<small>points</small></div></div></div>' +
      '<p class="sub" style="margin-top:12px">' + (G.shields > shieldsStart ? '🛡️ You earned ' + (G.shields - shieldsStart) + ' shield' + (G.shields - shieldsStart > 1 ? 's' : '') + '. ' : '') + 'Shields: ' + G.shields + '/3. ' + (waves ? 'Waves cleared: ' + waves + '.' : '') + '</p>' +
      '<div class="row" style="margin-top:14px"><button class="btn" id="go" type="button">Next circuit ➜</button></div></div>' +
      '<div style="text-align:center"><div class="bounce" style="display:inline-block">' + staticSVG(zaps >= 15 ? 'hurt' : 'laugh', 180) + '</div></div></div>');
    $('#go').onclick = () => { G.circuit++; circuitIntro(); };
  }
}

// ================= end =================
function endScreen() {
  const acc = G.moves + G.mistakes ? Math.round(100 * G.moves / (G.moves + G.mistakes)) : 100;
  const key = 'sc-best-' + G.mode, prev = +store.get(key, '0'), newBest = G.score > prev; if (newBest) store.set(key, String(G.score));
  netPush('done', G.score);
  setScreen('end', '<div class="grid2"><div class="card"><div class="kicker">All 5 circuits restored · ' + G.mode.toUpperCase() + '</div><h2 style="font-size:38px;margin:6px 0 8px">🏁 Static is defeated!</h2>' +
    '<div style="font-size:60px;font-weight:800;color:var(--volt)">' + G.score.toLocaleString() + '</div><p class="note" style="margin-top:0">points' + (newBest ? ' · <b style="color:var(--hot)">new personal best!</b>' : ' · your best: ' + prev.toLocaleString()) + '</p>' +
    '<div class="grid3"><div class="card"><div class="stat">' + acc + '%<small>move accuracy</small></div></div><div class="card"><div class="stat">' + G.perfect + '/' + G.puzzlesDone + '<small>perfect arrays</small></div></div><div class="card"><div class="stat">' + G.bestStreak + '<small>best streak</small></div></div></div>' +
    '<div id="endlb"></div><div class="row" style="margin-top:14px"><button class="btn" id="again" type="button">Play again ⚡</button><button class="btn ghost" id="sw" type="button">Try ' + (G.mode === 'sl' ? 'HL' : 'SL') + ' mode</button></div></div>' +
    '<div style="text-align:center"><div class="bounce" style="display:inline-block">' + staticSVG('hurt', 220) + '</div><p class="note">“Fine. FINE. Your arrays are sorted. I’ll be in the recycle bin.”</p></div></div>');
  SFX.win(); $('#again').onclick = titleScreen; $('#sw').onclick = () => { G.mode = G.mode === 'sl' ? 'hl' : 'sl'; store.set('sc-mode', G.mode); titleScreen(); };
  renderLbInto($('#endlb'), true);
}

// ================= class leaderboard (Firebase) =================
const NET = { db: null, ref: null, rows: [], status: 'off', pid: null };
function loadScript(src) { return new Promise((res, rej) => { const el = document.createElement('script'); el.src = src; el.onload = res; el.onerror = () => rej(new Error('load')); document.head.appendChild(el); }); }
function roomPath() { return 'rooms/sc-' + G.mode + '-' + G.cls + '/info'; }
async function netJoin() {
  NET.rows = []; NET.status = 'off'; if (NET.ref) { try { NET.ref.off(); } catch (e) {} NET.ref = null; }
  if (!G.cls || !window.FIREBASE_CONFIG) return;
  NET.status = 'connecting';
  try {
    for (const u of ['https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js', 'https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js'])
      if (!(window.firebase && window.firebase.database)) await loadScript(u);
    const fb = window.firebase, app = fb.apps.find(a => a.name === 'sc') || fb.initializeApp(window.FIREBASE_CONFIG, 'sc');
    NET.db = app.database();
    let pid = store.get('sc-pid', ''); if (!pid) { pid = 'p' + Math.random().toString(36).slice(2, 12); store.set('sc-pid', pid); } NET.pid = pid;
    NET.ref = NET.db.ref(roomPath());
    NET.ref.on('value', snap => {
      const v = snap.val() || {};
      NET.rows = Object.keys(v).map(id => ({ me: id === NET.pid, n: String((v[id] && v[id].nick) || '?').slice(0, 16), s: Math.max(0, Math.min(1e7, Math.floor(+(v[id] && v[id].score) || 0))), st: String((v[id] && v[id].stage) || '').slice(0, 8) })).sort((a, b) => b.s - a.s);
      NET.status = 'on'; document.querySelectorAll('[data-lb]').forEach(el => renderLbInto(el, el.dataset.lb === 'end'));
    }, () => { NET.status = 'fail'; });
  } catch (e) { NET.status = 'fail'; }
}
function netPush(stage, finalScore) {
  if (!NET.db || !NET.pid) return;
  const live = finalScore !== undefined ? finalScore : G.score, mine = NET.rows.find(r => r.me);
  if (mine && mine.st === 'done' && mine.s > live) return;
  try { NET.db.ref(roomPath() + '/' + NET.pid).set({ nick: G.nick, nm: G.nick, score: live, stage }).catch(() => {}); } catch (e) {}
}
function renderLbInto(el, isEnd) {
  if (!el) return; el.dataset.lb = isEnd ? 'end' : 'modal';
  if (!G.cls) { el.innerHTML = isEnd ? '<p class="note" style="margin-top:12px">Add a class code on the title screen to compare scores with your classmates.</p>' : '<p class="sub">You’re playing without a class code. Add one on the title screen to compare scores with your class!</p>'; return; }
  if (NET.status === 'fail') { el.innerHTML = '<p class="note" style="margin-top:12px">Couldn’t reach the class leaderboard (maybe the school network blocks it). Your score still counts on this device.</p>'; return; }
  if (NET.status !== 'on') { el.innerHTML = '<p class="note" style="margin-top:12px">Connecting to the class leaderboard…</p>'; return; }
  const ST = { c1: 'Circuit 1', c2: 'Circuit 2', c3: 'Circuit 3', c4: 'Circuit 4', c5: 'Circuit 5', done: 'Finished' };
  el.innerHTML = '<div class="kicker" style="margin-top:14px">Class ' + esc(G.cls.toUpperCase()) + ' · ' + G.mode.toUpperCase() + '</div><ol class="lb">' +
    (NET.rows.slice(0, 15).map((r, i) => '<li class="' + (r.me ? 'me' : '') + '"><span>' + (i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : (i + 1)) + '</span><span>' + esc(r.n) + (r.me ? ' (you)' : '') + '</span><span class="note">' + (ST[r.st] || '') + '</span><span class="s">' + r.s.toLocaleString() + '</span></li>').join('') || '<li><span></span><span class="note">No scores yet. Be the first!</span><span></span><span></span></li>') + '</ol>';
}
function showLeaderboard() {
  const m = $('#modal'); m.innerHTML = '<div class="card"><h2 style="font-size:24px">🏆 Class leaderboard</h2><div id="mlb"></div><div class="row" style="margin-top:12px"><button class="btn" id="mclose" type="button">Close</button></div></div>';
  m.hidden = false; renderLbInto($('#mlb'), false);
  $('#mclose').onclick = () => { m.hidden = true; m.innerHTML = ''; }; m.onclick = e => { if (e.target === m) { m.hidden = true; m.innerHTML = ''; } };
}

// test hooks (used by the automated checks; harmless in class)
window.SC = { G, get P() { return P; }, act, expected, startPuzzle, circuitIntro, finishPuzzle, posOf, smashIntro, endScreen };
titleScreen();
})();
